{%extends 'backend/index.html'%}
{%load static%}
{%load rmeditor%}
{%block body%}
{%rmeditor_media%}
<script>
    function validateForm() {
        if (window.RMEditor) RMEditor.syncAll();
        var name = document.getElementById("name").value;
        
        // Extract usernames from the 'unames' object
        var existingName = [];
        {% for item in supercategories %}
        existingName.push('{{ item.name }}');
        {% endfor %}

        // Check if the entered username already exists in the 'existingName' array
        if (existingName.includes(name)) {
            alert("Supercategory already Exist.");
            return false; // Prevent form submission
        }
        return true; // Allow form submission if all validations pass
    }
</script>

<!-- ============================================================== -->
<div class="main-contentw-100">
    <div class="">
        <div class="container-fluid">
            
            <!-- end row -->
            
            <div class="row">
                <div class="col-xl-12">
                    <div class="card">
                        <div class="card-body">

                            <h4 class=" text-center border bg-light p-1">Add Supercategory</h4>
                            <form method="post" enctype="multipart/form-data" onsubmit="return validateForm();" >
                                {%csrf_token%}
                                <div class="row">
                                    <div class="col-lg-6">
                                        <div class="mb-3">
                                            <label class="form-label">Supercategory Name<span class="text-danger">*</span></label>
                                            <input type="text" id="name" class="form-control" placeholder="Enter Supercategory Name" name="name" required>
                                        </div>
                                    </div>
                                    <div class="col-lg-6">
                                        <div class="mb-3">
                                            <label class="form-label">Icon / Image (Optional)</label>
                                            <input type="file" accept=".png,.jpg,.jpeg,.webp" class="form-control" name="image">
                                        </div>
                                    </div>
                                    <div class="col-lg-12">
                                        <div class="mb-3">
                                            <label class="form-label">Page / SEO Title (Optional)</label>
                                            <input type="text" class="form-control" placeholder="Enter SEO Heading / Title" name="title">
                                        </div>
                                    </div>
                                    <div class="col-lg-12">
                                        <div class="mb-3">
                                            <label class="form-label">Category Blog / SEO Description (Rich Text Editor)</label>
                                            <textarea class="form-control rmeditor" rows="6" placeholder="Write rich-text blog, article or description for this supercategory..." name="description"></textarea>
                                        </div>
                                    </div>
                                </div>
                                <div class="text-center">
                                    <button type="submit" class="btn btn-primary text-center mt-4" style="padding:2px 50px;">Add</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <!-- end row -->
        </div> 
    </div>
    <!-- End Page-content -->

    {%endblock%}
