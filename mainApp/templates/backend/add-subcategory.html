{%extends 'backend/index.html'%}
{%load static%}
{%load rmeditor%}
{%block body%}
{%rmeditor_media%}
<!-- ============================================================== -->


<div class="main-contentw-100">
    <div class="">
        <div class="container-fluid">
            <!-- end row -->
            <div class="row">
                <div class="col-xl-12">
                    <div class="card">
                        <div class="card-body">
                            {% if messages %}
                            <div class="container bg-warning">
                                {% for message in messages %}
                                <div class="alert alert-{{ message.tags }} mt-2" role="alert">
                                    {{ message }}
                                </div>
                                {% endfor %}
                            </div>
                            {% endif %}
                        
                            <h4 class=" text-center">Add Subcategory</h4>
                            <form method="post" enctype="multipart/form-data" onsubmit="return validateForm();">
                                {%csrf_token%}
                                <div class="row">
                                    <div class="col-lg-3">
                                        <div class="mb-3">
                                            <label class="form-label">Maincategory<span class="text-danger">*</span></label>
                                            <select id="maincategory-select" class="form-control" name="maincategory"  title="Select Maincategory" required>
                                                <option value="" disabled selected>Select Maincategory &#9660;</option>
                                                {% for item in maincategories %}
                                                <option value="{{ item.slug }}">{{ item.name }}</option>
                                                {% endfor %}
                                            </select>
                                        </div>
                                    </div>
                                    
                                    <div class="col-lg-3">
                                        <div class="mb-3">
                                            <label class="form-label">Category<span class="text-danger">*</span></label>
                                            <select id="subcategory-select" class="form-control" name="category" required>
                                                <option value="" disabled selected>Select Category &#9660;</option>
                                            </select>
                                        </div>
                                    </div>
                                    
                                    <script>
                                        document.getElementById('maincategory-select').addEventListener('change', function() {
                                            var maincategory = this.value;
                                            var subcategorySelect = document.getElementById('subcategory-select');
                                            subcategorySelect.innerHTML = '<option value="#" disabled selected>Select Category &#9660;</option>';
                                            {% for item in categories %}
                                                if ('{{ item.maincategory.slug }}' === maincategory) {
                                                    var option = document.createElement('option');
                                                    option.value = '{{ item.slug }}';
                                                    option.text = '{{ item.name }}';
                                                    subcategorySelect.appendChild(option);
                                                }
                                            {% endfor %}
                                        });
                                    </script>
                                    
                                    <div class="col-lg-3">
                                        <div class="mb-3">
                                            <label class="form-label">Name<span class="text-danger">*</span></label>
                                            <input type="text" id="name" class="form-control" placeholder="Enter Name" name="name" required>
                                        </div>
                                    </div>
                                    
                                    <div class="col-lg-3">
                                        <div class="mb-3">
                                            <label class="form-label">Icon<span class="text-danger">*</span></label>
                                            <input type="file" accept=".png,.jpg,.jpeg,.webp" class="form-control" name="image" required>
                                        </div>
                                    </div>
                                    
                                    <div class="col-lg-12">
                                        <div class="mb-3">
                                            <label class="form-label">Page / SEO Title (Optional)</label>
                                            <input type="text" class="form-control" placeholder="Enter SEO Heading / Title" name="title">
                                        </div>
                                    </div>
                                    
                                    <div class="col-lg-12">
                                        <div class="mb-3">
                                            <label class="form-label">Category Blog / SEO Description (Rich Text Editor)</label>
                                            <textarea rows="6" class="form-control rmeditor" placeholder="Write rich-text blog, article or description for this subcategory..." name="description"></textarea>
                                        </div>
                                    </div>
                                </div>
                               
                                <div class="text-center">
                                    <button type="submit" class="btn btn-primary text-center mt-4" style="padding:2px 50px;">Add</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <!-- end row -->
        </div> 
    </div>
    <!-- End Page-content -->

{%endblock%}
