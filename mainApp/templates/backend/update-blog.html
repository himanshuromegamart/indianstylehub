{%extends 'backend/index.html'%}
{%load static%}
{%block body%}
<!-- ============================================================== -->
<div class="main-contentw-100">
    <div class="">
        <div class="container-fluid">
            
            <!-- end row -->
            
            <div class="row">
                <div class="col-xl-12">
                    <div class="card">
                        <div class="card-body">

                        <h4 class=" text-center bg-primary text-light p-1">UPDATE BLOG</h4>
                        <form method="post" enctype="multipart/form-data">
                            {%csrf_token%}
                            <div class="row">
                                
                                <div class="col-lg-1 mt-3">
                                    <div class="">
                                        <img src="{{blog.image}}" alt="Image" style="height:50px;width:80px;border-radius:5px">
                                    </div>
                                </div>
                                <div class="col-lg-2">
                                    <div class="mb-3">
                                        <label class="form-label">Image</label>
                                        <input type="file" accept=".png,.jpg,.jpeg,.webp" class="form-control" name="image">
                                    </div>
                                </div>

                                
                          
                            <div class="col-lg-9">
                                <div class="mb-3">
                                    <label class="form-label">Title</label>
                                    <input type="text" class="form-control" id="colorpicker-default" placeholder="Enter Title" name="title" value="{{blog.title}}" >
                                </div>
                             </div>

                             <div class="col-lg-12">
                                <div class="mb-3">
                                    <label class="form-label">Slug</label>
                                    <input type="text" class="form-control" id="colorpicker-default" placeholder="Enter Slug" name="slug" value="{{blog.slug}}" >
                                </div>
                             </div>

                             <div class="col-lg-12">
                                <div class="mb-3">
                                    <label class="form-label">Meta Description</label>
                                    <input type="text" class="form-control" placeholder="Enter Meta Description" name="meta_description" value="{{blog.meta_description}}">
                                </div>
                            </div>

                            <div class="col-lg-12">
                                <div class="mb-3">
                                    <label class="form-label">Description</label>
                                    <textarea class="form-control" placeholder="Enter Description" name="description">{{blog.description}}</textarea>
                                </div>
                            </div>
                           
                            <script>
                                tinymce.init({
                                    selector: 'textarea',
                                    plugins: 'anchor autolink charmap codesample emoticons image link lists media searchreplace table visualblocks wordcount',
                                    toolbar: 'undo redo | blocks fontfamily fontsize | bold italic underline strikethrough | link image media table | align lineheight | numlist bullist indent outdent | emoticons charmap | removeformat',
                                    convert_urls: false  // Disable URL conversion
                                });
                            </script>
                              
                            <div class="text-center">
                                <button type="submit" class="btn btn-primary text-center mt-4" style="padding:2px 50px;">Update</submit>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <!-- end row -->
        </div> 
    </div>
    <!-- End Page-content -->

    {%endblock%}
