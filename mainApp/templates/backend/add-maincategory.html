{%extends 'backend/index.html'%}
{%load static%}
{%block body%}
<script>
    function validateForm() {
        var name = document.getElementById("name").value;
        
        // Extract usernames from the 'unames' object
        var existingName = [];
        {% for item in maincategories %}
        existingName.push('{{ item.name }}');
        {% endfor %}

        // Check if the entered username already exists in the 'existingName' array
        if (existingName.includes(name)) {
            alert("Maincategory already Exist.");
            return false; // Prevent form submission
        }
        return true; // Allow form submission if all validations pass
    }
</script>

<!-- ============================================================== -->
<div class="main-contentw-100">
    <div class="">
        <div class="container-fluid">
            
            <!-- end row -->
            
            <div class="row">
                <div class="col-xl-12">
                    <div class="card">
                        <div class="card-body">

                            <h4 class=" text-center border bg-light p-1">Add Maincategory</h4>
                            <form method="post" enctype="multipart/form-data" onsubmit="return validateForm();" >
                                {%csrf_token%}
                                <div class="row">
                                <div class="col-lg-3">
                                   <div class="mb-3">
                                       <label class="form-label">Supercategory<span class="text-danger">*</span></label>
                                       <select class="form-control" name="supercategory" required>
                                           <option value="" disabled selected>Select Supercategory &#9660;</option>
                                           {% for sc in supercategories %}
                                           <option value="{{ sc.id }}">{{ sc.name }}</option>
                                           {% endfor %}
                                       </select>
                                   </div>
                                </div>
                                <div class="col-lg-3">
                                   <div class="mb-3">
                                       <label class="form-label">Maincategory Name<span class="text-danger">*</span></label>
                                       <input type="text" id="name" class="form-control" placeholder="Enter Maincategory Name" name="name" required>
                                   </div>
                                </div>
                                <div class="col-lg-3">
                                    <div class="mb-3">
                                        <label class="form-label">Icon(100x100px)<span class="text-danger">*</span></label>
                                        <input type="file" accept=".png,.jpg,.jpeg,.webp" class="form-control" name="image" required>
                                    </div>
                                </div>
                                <div class="col-lg-3">
                                    <div class="mb-3">
                                        <label class="form-label">Banner1<span class="text-danger">*</span></label>
                                        <input type="file" accept=".png,.jpg,.jpeg,.webp" class="form-control" name="banner1" required>
                                    </div>
                                </div>

                                <div class="col-lg-3">
                                    <div class="mb-3">
                                        <label class="form-label">Banner<span class="text-danger">*</span></label>
                                        <input type="file" accept=".png,.jpg,.jpeg,.webp" class="form-control" name="banner2" required>
                                    </div>
                                </div>

                                <div class="col-lg-3">
                                    <div class="mb-3">
                                        <label class="form-label">Banner<span class="text-danger">*</span></label>
                                        <input type="file" accept=".png,.jpg,.jpeg,.webp" class="form-control" name="banner3" required>
                                    </div>
                                </div>

                                <div class="col-lg-3">
                                    <div class="mb-3">
                                        <label class="form-label">Banner<span class="text-danger">*</span></label>
                                        <input type="file" accept=".png,.jpg,.jpeg,.webp" class="form-control" name="banner4" required>
                                    </div>
                                </div>
                                
                                 <div class="col-lg-6">
                                    <div class="mb-3">
                                        <label class="form-label">Meta Title</label>
                                        <input type="text" class="form-control" placeholder="Enter Meta Title"name="title" >
                                    </div>
                                 </div>
                               <div class="col-lg-12">
                                    <div class="mb-3">
                                        <label class="form-label">Meta Description</label>
                                        <textarea row="2"col="10" class="form-control" placeholder="Enter Meta Description"name="description" ></textarea>
                                    </div>
                                 </div>
                               
                                
                            <div class="text-center">
                                <button type="submit" class="btn btn-primary text-center mt-4" style="padding:2px 50px;">Add</submit>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <!-- end row -->
        </div> 
    </div>
    <!-- End Page-content -->

    {%endblock%}
