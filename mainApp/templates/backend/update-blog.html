{% extends 'backend/index.html' %}
{% load static %}
{% load rmeditor %}
{% block body %}
{% rmeditor_media %}
<!-- ============================================================== -->
<div class="main-contentw-100">
    <div class="">
        <div class="container-fluid">
            <div class="row">
                <div class="col-xl-12">
                    <div class="card">
                        <div class="card-body">

                        <h4 class="text-center bg-primary text-light p-2 rounded">UPDATE BLOG / ARTICLE</h4>
                        <form method="post" enctype="multipart/form-data">
                            {% csrf_token %}
                            <div class="row">
                                {% if blog.image %}
                                <div class="col-lg-1 mt-3">
                                    <img src="{{ blog.image }}" alt="Image" style="height:55px;width:75px;border-radius:5px;object-fit:cover;">
                                </div>
                                {% endif %}
                                <div class="{% if blog.image %}col-lg-5{% else %}col-lg-6{% endif %}">
                                    <div class="mb-3">
                                        <label class="form-label">Featured Image (Leave empty to keep existing)</label>
                                        <input type="file" accept=".png,.jpg,.jpeg,.webp" class="form-control" name="image">
                                    </div>
                                </div>

                                <div class="col-lg-6">
                                    <div class="mb-3">
                                        <label class="form-label">Title <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" placeholder="Enter Title" name="title" value="{{ blog.title }}" required>
                                    </div>
                                </div>

                                <div class="col-lg-4">
                                    <div class="mb-3">
                                        <label class="form-label">Connected Supercategory</label>
                                        <select name="supercategory" class="form-control">
                                            <option value="">-- None / General Blog --</option>
                                            {% for item in supercategories %}
                                            <option value="{{ item.id }}" {% if blog.supercategory and blog.supercategory.id == item.id %}selected{% endif %}>{{ item.name }}</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                </div>

                                <div class="col-lg-4">
                                    <div class="mb-3">
                                        <label class="form-label">Connected Category</label>
                                        <select name="category" class="form-control">
                                            <option value="">-- None --</option>
                                            {% for item in categories %}
                                            <option value="{{ item.id }}" {% if blog.category and blog.category.id == item.id %}selected{% endif %}>{{ item.name }} ({{ item.maincategory.name }})</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                </div>

                                <div class="col-lg-4">
                                    <div class="mb-3">
                                        <label class="form-label">Connected Product</label>
                                        <select name="product" class="form-control">
                                            <option value="">-- None --</option>
                                            {% for item in products %}
                                            <option value="{{ item.id }}" {% if blog.product and blog.product.id == item.id %}selected{% endif %}>{{ item.name|truncatechars:45 }}</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                </div>

                                <div class="col-lg-6">
                                    <div class="mb-3">
                                        <label class="form-label">Slug</label>
                                        <input type="text" class="form-control" placeholder="Enter Slug" name="slug" value="{{ blog.slug }}">
                                    </div>
                                </div>

                                <div class="col-lg-6">
                                    <div class="mb-3">
                                        <label class="form-label">SEO Meta Description</label>
                                        <input type="text" class="form-control" placeholder="Enter Meta Description" name="meta_description" value="{{ blog.meta_description|default:'' }}">
                                    </div>
                                </div>

                                <div class="col-lg-12">
                                    <div class="mb-3">
                                        <label class="form-label">Blog Content / Article Body (Rich Text Editor) <span class="text-danger">*</span></label>
                                        <textarea class="form-control rmeditor" rows="12" placeholder="Write rich text article..." name="description">{{ blog.description|default:'' }}</textarea>
                                    </div>
                                </div>
                            </div>
                              
                            <div class="text-center">
                                <button type="submit" class="btn btn-primary text-center mt-3" style="padding:6px 50px;">Update Blog</button>
                            </div>
                        </form>
                        </div>
                    </div>
                </div>
            </div>
        </div> 
    </div>
</div>
{% endblock %}
